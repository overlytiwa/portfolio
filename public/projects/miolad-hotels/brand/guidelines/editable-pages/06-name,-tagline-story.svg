<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="900" viewBox="0 0 1280 900"><rect x="0" y="0" width="1280" height="900" rx="0" fill="#FFFFFF"/><text x="70" y="51" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="2">MIOLAD HOTELS</text><text x="1210" y="51" fill="#58647B" font-family="Manrope" font-size="13" font-weight="400" text-anchor="end">NAME, TAGLINE &amp; STORY</text><path d="M70 74H1210" stroke="#DDE2EE" stroke-width="1"/><path d="M70 842H1210" stroke="#DDE2EE" stroke-width="1"/><text x="70" y="873" fill="#58647B" font-family="Manrope" font-size="11" font-weight="400" text-anchor="start" letter-spacing="1">BRAND GUIDELINES / 2026</text><text x="1210" y="873" fill="#1B3FC6" font-family="Manrope" font-size="12" font-weight="400" text-anchor="end">06</text><text x="70" y="172" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="64" font-weight="400" text-anchor="start">MIOLAD Hotels. Settle in.</text><text x="70" y="240" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">NAME</text><text x="70" y="281.0" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">Keep MIOLAD Hotels. Use MIOLAD in uppercase in</text><text x="70" y="314.6" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">the wordmark; use MIOLAD Hotels in ordinary</text><text x="70" y="348.2" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">writing. No invented name origin.</text><text x="70" y="450" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">TAGLINE</text><text x="70" y="522" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="78" font-weight="400" text-anchor="start">Settle in.</text><text x="70" y="580.0" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">Use as an invitation on a hero, welcome card or</text><text x="70" y="613.6" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">campaign. Do not repeat it beside every logo.</text><text x="660" y="240" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">PROPOSED BRAND STORY</text><text x="660" y="285" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">MIOLAD begins with a simple idea: arriving at</text><text x="660" y="324" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">a hotel should feel straightforward. With nine</text><text x="660" y="363" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">rooms and a clear nightly rate, the brand is</text><text x="660" y="402" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">built around hospitality on a smaller scale. Its</text><text x="660" y="441" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">white-and-blue identity gives that idea a</text><text x="660" y="480" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">calm, confident expression, from the first</text><text x="660" y="519" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">enquiry to the final goodbye.</text><text x="660" y="748" fill="#58647B" font-family="Manrope" font-size="16" font-weight="400" text-anchor="start">Brand narrative, not a claim about founder history.</text></svg>