<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="900" viewBox="0 0 1280 900"><rect x="0" y="0" width="1280" height="900" rx="0" fill="#FFFFFF"/><text x="70" y="51" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="2">MIOLAD HOTELS</text><text x="1210" y="51" fill="#58647B" font-family="Manrope" font-size="13" font-weight="400" text-anchor="end">COLOUR PALETTE</text><path d="M70 74H1210" stroke="#DDE2EE" stroke-width="1"/><path d="M70 842H1210" stroke="#DDE2EE" stroke-width="1"/><text x="70" y="873" fill="#58647B" font-family="Manrope" font-size="11" font-weight="400" text-anchor="start" letter-spacing="1">BRAND GUIDELINES / 2026</text><text x="1210" y="873" fill="#1B3FC6" font-family="Manrope" font-size="12" font-weight="400" text-anchor="end">10</text><text x="70" y="172" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="64" font-weight="400" text-anchor="start">White space. Royal blue.</text><rect x="70" y="237" width="440" height="340" rx="0" fill="#1B3FC6"/><text x="100" y="491" fill="#FFFFFF" font-family="Cormorant Garamond" font-size="42" font-weight="400" text-anchor="start">Royal blue</text><text x="100" y="535" fill="#FFFFFF" font-family="Manrope" font-size="18" font-weight="400" text-anchor="start">#1B3FC6 / RGB 27, 63, 198</text><rect x="530" y="237" width="320" height="340" rx="0" fill="#FFFFFF" stroke="#DDE2EE"/><text x="555" y="491" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="42" font-weight="400" text-anchor="start">White</text><text x="555" y="535" fill="#1B3FC6" font-family="Manrope" font-size="18" font-weight="400" text-anchor="start">#FFFFFF</text><rect x="870" y="237" width="340" height="152" rx="0" fill="#14213B"/><text x="895" y="292" fill="#FFFFFF" font-family="Cormorant Garamond" font-size="30" font-weight="400" text-anchor="start">Ink</text><text x="895" y="340" fill="#FFFFFF" font-family="Manrope" font-size="18" font-weight="400" text-anchor="start">#14213B</text><rect x="870" y="409" width="340" height="168" rx="0" fill="#EEF2FF"/><text x="895" y="465" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="30" font-weight="400" text-anchor="start">Mist</text><text x="895" y="520" fill="#1B3FC6" font-family="Manrope" font-size="18" font-weight="400" text-anchor="start">#EEF2FF</text><text x="70" y="640" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">RECOMMENDED BALANCE</text><text x="70" y="683.0" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">About 75% white, 15% photography, 10% blue and</text><text x="70" y="716.6" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">ink. Blue is the accent, not a tinted page background.</text><text x="690" y="640" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">ACCESSIBLE PAIRINGS</text><text x="690" y="683.0" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">Blue / white: 8.2:1. Ink / white: 16.0:1. Use these for</text><text x="690" y="716.6" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">normal text. Mist is a quiet supporting fill.</text><text x="70" y="803" fill="#58647B" font-family="Manrope" font-size="16" font-weight="400" text-anchor="start">Digital values are authoritative. Print from a colour-managed proof; do not guess a Pantone match.</text></svg>