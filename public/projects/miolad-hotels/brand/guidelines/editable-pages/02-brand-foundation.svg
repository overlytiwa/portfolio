<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="900" viewBox="0 0 1280 900"><rect x="0" y="0" width="1280" height="900" rx="0" fill="#FFFFFF"/><text x="70" y="51" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="2">MIOLAD HOTELS</text><text x="1210" y="51" fill="#58647B" font-family="Manrope" font-size="13" font-weight="400" text-anchor="end">BRAND FOUNDATION</text><path d="M70 74H1210" stroke="#DDE2EE" stroke-width="1"/><path d="M70 842H1210" stroke="#DDE2EE" stroke-width="1"/><text x="70" y="873" fill="#58647B" font-family="Manrope" font-size="11" font-weight="400" text-anchor="start" letter-spacing="1">BRAND GUIDELINES / 2026</text><text x="1210" y="873" fill="#1B3FC6" font-family="Manrope" font-size="12" font-weight="400" text-anchor="end">02</text><text x="70" y="172" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="64" font-weight="400" text-anchor="start">Small hotel. Clear offer.</text><text x="70" y="246" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">CONFIRMED FOUNDATION</text><text x="70" y="294.0" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">MIOLAD Hotels is the fixed brand name. The</text><text x="70" y="334.0" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">hotel has nine rooms. Each room is currently</text><text x="70" y="374.0" fill="#14213B" font-family="DejaVu Sans" font-size="25" font-weight="400" text-anchor="start">priced at ₦100,000 per night.</text><text x="690" y="246" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">DESIGN TASK</text><text x="690" y="294.0" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">Create a calm, distinct identity with a white</text><text x="690" y="334.0" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">background, royal blue accents and clear</text><text x="690" y="374.0" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">language. Use the supplied exterior as the</text><text x="690" y="414.0" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">visual anchor.</text><path d="M70 495H1210" stroke="#DDE2EE" stroke-width="1"/><text x="70" y="551" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">WHAT THE IDENTITY SHOULD DO</text><text x="70" y="596.0" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">Make the hotel recognizable. Help guests</text><text x="70" y="631.2" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">understand the offer. Make it easy to plan dates</text><text x="70" y="666.4" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">and speak with reception.</text><text x="690" y="551" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">WHAT STILL NEEDS CONFIRMATION</text><text x="690" y="596.0" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">Location, public contacts, room facilities, guest</text><text x="690" y="631.2" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">capacity, payment and cancellation terms. No</text><text x="690" y="666.4" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">ratings, reviews or amenities are invented.</text></svg>