<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="900" viewBox="0 0 1280 900"><rect x="0" y="0" width="1280" height="900" rx="0" fill="#FFFFFF"/><text x="70" y="51" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="2">MIOLAD HOTELS</text><text x="1210" y="51" fill="#58647B" font-family="Manrope" font-size="13" font-weight="400" text-anchor="end">POSITIONING &amp; PERSONALITY</text><path d="M70 74H1210" stroke="#DDE2EE" stroke-width="1"/><path d="M70 842H1210" stroke="#DDE2EE" stroke-width="1"/><text x="70" y="873" fill="#58647B" font-family="Manrope" font-size="11" font-weight="400" text-anchor="start" letter-spacing="1">BRAND GUIDELINES / 2026</text><text x="1210" y="873" fill="#1B3FC6" font-family="Manrope" font-size="12" font-weight="400" text-anchor="end">05</text><text x="70" y="172" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="64" font-weight="400" text-anchor="start">Calm, with a point of view.</text><rect x="70" y="228" width="1140" height="245" rx="0" fill="#EEF2FF"/><text x="100" y="308.0" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="55" font-weight="400" text-anchor="start">A small hotel with a clear offer</text><text x="100" y="361.9" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="55" font-weight="400" text-anchor="start">and a calm, distinctive presence.</text><text x="70" y="536" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">COMPOSED</text><text x="70" y="577.0" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">Space, balance and measured</text><text x="70" y="610.6" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">typography.</text><text x="470" y="536" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">WELCOMING</text><text x="470" y="577.0" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">Direct, human language.</text><text x="470" y="610.6" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">Useful guidance.</text><text x="870" y="536" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">CONFIDENT</text><text x="870" y="577.0" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">One strong blue. A</text><text x="870" y="610.6" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">recognizable symbol.</text><path d="M70 689H1210" stroke="#DDE2EE" stroke-width="1"/><text x="70" y="747.0" fill="#14213B" font-family="Manrope" font-size="23" font-weight="400" text-anchor="start">The promise is clarity and a considered experience. Service claims should follow what the hotel can</text><text x="70" y="783.8" fill="#14213B" font-family="Manrope" font-size="23" font-weight="400" text-anchor="start">consistently deliver.</text></svg>