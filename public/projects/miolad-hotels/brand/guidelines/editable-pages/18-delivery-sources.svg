<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="900" viewBox="0 0 1280 900"><rect x="0" y="0" width="1280" height="900" rx="0" fill="#FFFFFF"/><text x="70" y="51" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="2">MIOLAD HOTELS</text><text x="1210" y="51" fill="#58647B" font-family="Manrope" font-size="13" font-weight="400" text-anchor="end">DELIVERY &amp; SOURCES</text><path d="M70 74H1210" stroke="#DDE2EE" stroke-width="1"/><path d="M70 842H1210" stroke="#DDE2EE" stroke-width="1"/><text x="70" y="873" fill="#58647B" font-family="Manrope" font-size="11" font-weight="400" text-anchor="start" letter-spacing="1">BRAND GUIDELINES / 2026</text><text x="1210" y="873" fill="#1B3FC6" font-family="Manrope" font-size="12" font-weight="400" text-anchor="end">18</text><text x="70" y="172" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="64" font-weight="400" text-anchor="start">Ready to use. Easy to extend.</text><text x="70" y="235" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">ASSET HAND-OFF</text><text x="70" y="272.0" fill="#14213B" font-family="Manrope" font-size="19" font-weight="400" text-anchor="start">SVG keeps artwork editable; PNG is ready to place. Print</text><text x="70" y="302.4" fill="#14213B" font-family="Manrope" font-size="19" font-weight="400" text-anchor="start">PDFs contain bleed and trim boxes. Install the included fonts</text><text x="70" y="332.8" fill="#14213B" font-family="Manrope" font-size="19" font-weight="400" text-anchor="start">before editing SVG text. Brand-book pages are also supplied</text><text x="70" y="363.2" fill="#14213B" font-family="Manrope" font-size="19" font-weight="400" text-anchor="start">as SVG.</text><text x="70" y="448" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">FIGMA STATUS</text><text x="70" y="485.0" fill="#14213B" font-family="Manrope" font-size="19" font-weight="400" text-anchor="start">The native logo family, colour variables, type styles and hotel</text><text x="70" y="515.4" fill="#14213B" font-family="Manrope" font-size="19" font-weight="400" text-anchor="start">image were created in Figma. The Starter tool quota then</text><text x="70" y="545.8" fill="#14213B" font-family="Manrope" font-size="19" font-weight="400" text-anchor="start">blocked further edits. Collateral, website boards and book</text><text x="70" y="576.2" fill="#14213B" font-family="Manrope" font-size="19" font-weight="400" text-anchor="start">pages were completed as editable SVGs outside Figma.</text><text x="70" y="710" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">BEFORE PUBLISHING</text><text x="70" y="745.0" fill="#14213B" font-family="Manrope" font-size="19" font-weight="400" text-anchor="start">Add approved public contacts, verify the hotel facts and</text><text x="70" y="775.4" fill="#14213B" font-family="Manrope" font-size="19" font-weight="400" text-anchor="start">replace bracketed template copy.</text><text x="680" y="235" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">RESEARCH / OFFICIAL SOURCES</text><text x="680" y="275" fill="#14213B" font-family="Manrope" font-size="16" font-weight="400" text-anchor="start">terrenohotel.com/en/</text><text x="680" y="306" fill="#14213B" font-family="Manrope" font-size="16" font-weight="400" text-anchor="start">terrenohotel.com/en/the-hotel/</text><text x="680" y="337" fill="#14213B" font-family="Manrope" font-size="16" font-weight="400" text-anchor="start">nordichotelsnigeria.com/nordic-hotel-lagos/</text><text x="680" y="368" fill="#14213B" font-family="Manrope" font-size="16" font-weight="400" text-anchor="start">about-nordic-hotel-lagos/</text><text x="680" y="399" fill="#14213B" font-family="Manrope" font-size="16" font-weight="400" text-anchor="start">thewheatbakerlagos.com/about-the-wheatbaker/</text><text x="680" y="430" fill="#14213B" font-family="Manrope" font-size="16" font-weight="400" text-anchor="start">thegeorgelagos.com/en/about_us.html</text><text x="680" y="522" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">ASSET SOURCES</text><text x="680" y="560" fill="#14213B" font-family="Manrope" font-size="17" font-weight="400" text-anchor="start">Exterior image: supplied by the hotel owner.</text><text x="680" y="594" fill="#14213B" font-family="Manrope" font-size="17" font-weight="400" text-anchor="start">Fonts: Google Fonts, SIL Open Font License.</text><text x="680" y="628" fill="#14213B" font-family="Manrope" font-size="17" font-weight="400" text-anchor="start">Icons: Lucide, ISC licence.</text><text x="680" y="662" fill="#14213B" font-family="Manrope" font-size="17" font-weight="400" text-anchor="start">Logo artwork: native MIOLAD Figma file.</text><text x="680" y="696" fill="#14213B" font-family="Manrope" font-size="17" font-weight="400" text-anchor="start">Research reviewed: 29 October 2026.</text><text x="680" y="788" fill="#58647B" font-family="Manrope" font-size="15" font-weight="400" text-anchor="start">Full source links and Figma link are in START-HERE.txt.</text></svg>