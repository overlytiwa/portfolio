<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="900" viewBox="0 0 1280 900"><rect x="0" y="0" width="1280" height="900" rx="0" fill="#FFFFFF"/><text x="70" y="51" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="2">MIOLAD HOTELS</text><text x="1210" y="51" fill="#58647B" font-family="Manrope" font-size="13" font-weight="400" text-anchor="end">BRAND RESEARCH</text><path d="M70 74H1210" stroke="#DDE2EE" stroke-width="1"/><path d="M70 842H1210" stroke="#DDE2EE" stroke-width="1"/><text x="70" y="873" fill="#58647B" font-family="Manrope" font-size="11" font-weight="400" text-anchor="start" letter-spacing="1">BRAND GUIDELINES / 2026</text><text x="1210" y="873" fill="#1B3FC6" font-family="Manrope" font-size="12" font-weight="400" text-anchor="end">03</text><text x="70" y="172" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="64" font-weight="400" text-anchor="start">What the category teaches us.</text><text x="70" y="238.0" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">Four positioning and design benchmarks. These are not verified direct local competitors; MIOLAD’s location</text><text x="70" y="273.2" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">has not been supplied.</text><path d="M70 300H1210" stroke="#DDE2EE" stroke-width="1"/><path d="M70 425H1210" stroke="#DDE2EE" stroke-width="1"/><path d="M70 550H1210" stroke="#DDE2EE" stroke-width="1"/><path d="M70 675H1210" stroke="#DDE2EE" stroke-width="1"/><path d="M70 800H1210" stroke="#DDE2EE" stroke-width="1"/><text x="70" y="342" fill="#1B3FC6" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">TERRENO</text><text x="305" y="339.0" fill="#14213B" font-family="Manrope" font-size="20" font-weight="400" text-anchor="start">Neighbourhood-led storytelling and expressive editorial photography. Borrow the visual</text><text x="305" y="371.0" fill="#14213B" font-family="Manrope" font-size="20" font-weight="400" text-anchor="start">rhythm, not its Palma setting or amenities.</text><text x="70" y="467" fill="#1B3FC6" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">NORDIC LAGOS</text><text x="305" y="464.0" fill="#14213B" font-family="Manrope" font-size="20" font-weight="400" text-anchor="start">A design-led identity with Scandinavian references. The lesson is consistency across type,</text><text x="305" y="496.0" fill="#14213B" font-family="Manrope" font-size="20" font-weight="400" text-anchor="start">imagery and guest-facing details.</text><text x="70" y="592" fill="#1B3FC6" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">THE WHEATBAKER</text><text x="305" y="589.0" fill="#14213B" font-family="Manrope" font-size="20" font-weight="400" text-anchor="start">Art gives the brand a recognizable point of view. MIOLAD needs its own recurring visual</text><text x="305" y="621.0" fill="#14213B" font-family="Manrope" font-size="20" font-weight="400" text-anchor="start">language, not generic luxury claims.</text><text x="70" y="717" fill="#1B3FC6" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">THE GEORGE</text><text x="305" y="714.0" fill="#14213B" font-family="Manrope" font-size="20" font-weight="400" text-anchor="start">A clear hierarchy for accommodation and rates. Make the offer easy to understand before</text><text x="305" y="746.0" fill="#14213B" font-family="Manrope" font-size="20" font-weight="400" text-anchor="start">asking a guest to enquire.</text></svg>