<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="900" viewBox="0 0 1280 900"><rect x="0" y="0" width="1280" height="900" rx="0" fill="#FFFFFF"/><text x="70" y="51" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="2">MIOLAD HOTELS</text><text x="1210" y="51" fill="#58647B" font-family="Manrope" font-size="13" font-weight="400" text-anchor="end">WEBSITE &amp; IMPLEMENTATION</text><path d="M70 74H1210" stroke="#DDE2EE" stroke-width="1"/><path d="M70 842H1210" stroke="#DDE2EE" stroke-width="1"/><text x="70" y="873" fill="#58647B" font-family="Manrope" font-size="11" font-weight="400" text-anchor="start" letter-spacing="1">BRAND GUIDELINES / 2026</text><text x="1210" y="873" fill="#1B3FC6" font-family="Manrope" font-size="12" font-weight="400" text-anchor="end">17</text><text x="70" y="172" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="64" font-weight="400" text-anchor="start">Useful by design.</text><text x="70" y="242" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">THE GUEST FLOW</text><text x="70" y="286.0" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">See the hotel. Understand the nightly rate.</text><text x="70" y="326.0" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">Choose dates and rooms. Review the</text><text x="70" y="366.0" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">estimate. Contact reception to confirm</text><text x="70" y="406.0" fill="#14213B" font-family="Manrope" font-size="25" font-weight="400" text-anchor="start">availability.</text><text x="70" y="516" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">WHAT WORKS</text><text x="70" y="558.0" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">Responsive layouts, a mobile menu,</text><text x="70" y="593.2" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">keyboard-friendly dialogs, photo viewing, a room</text><text x="70" y="628.4" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">estimate, downloadable stay details and</text><text x="70" y="663.6" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">reduced-motion support.</text><text x="690" y="242" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">CONNECT RECEPTION</text><text x="690" y="286.0" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">Add the approved public WhatsApp number or</text><text x="690" y="321.2" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">email in website/contact.js. The planner then</text><text x="690" y="356.4" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">prepares an enquiry in that service. It does not</text><text x="690" y="391.6" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">confirm a reservation.</text><text x="690" y="516" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1">PRIVACY &amp; SCOPE</text><text x="690" y="558.0" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">No tracking cookies or analytics. No public</text><text x="690" y="593.2" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">access to the receptionist database. No invented</text><text x="690" y="628.4" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">contact details. Desktop software remains a</text><text x="690" y="663.6" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">separate, authenticated application.</text><text x="70" y="803" fill="#58647B" font-family="Manrope" font-size="16" font-weight="400" text-anchor="start">Rates and available rooms remain subject to confirmation by reception.</text></svg>