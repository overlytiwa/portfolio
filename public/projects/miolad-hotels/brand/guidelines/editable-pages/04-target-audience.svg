<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="900" viewBox="0 0 1280 900"><rect x="0" y="0" width="1280" height="900" rx="0" fill="#FFFFFF"/><text x="70" y="51" fill="#1B3FC6" font-family="Manrope" font-size="14" font-weight="400" text-anchor="start" letter-spacing="2">MIOLAD HOTELS</text><text x="1210" y="51" fill="#58647B" font-family="Manrope" font-size="13" font-weight="400" text-anchor="end">TARGET AUDIENCE</text><path d="M70 74H1210" stroke="#DDE2EE" stroke-width="1"/><path d="M70 842H1210" stroke="#DDE2EE" stroke-width="1"/><text x="70" y="873" fill="#58647B" font-family="Manrope" font-size="11" font-weight="400" text-anchor="start" letter-spacing="1">BRAND GUIDELINES / 2026</text><text x="1210" y="873" fill="#1B3FC6" font-family="Manrope" font-size="12" font-weight="400" text-anchor="end">04</text><text x="70" y="172" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="64" font-weight="400" text-anchor="start">Design for the guest’s next step.</text><text x="70" y="238.0" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">Audience hypotheses to validate with actual enquiries and booking records. They guide this design; they are not a</text><text x="70" y="271.6" fill="#14213B" font-family="Manrope" font-size="21" font-weight="400" text-anchor="start">completed guest survey.</text><path d="M440 305L440 765" stroke="#DDE2EE" stroke-width="1"/><path d="M830 305L830 765" stroke="#DDE2EE" stroke-width="1"/><text x="70" y="355" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="64" font-weight="400" text-anchor="start">01</text><text x="470" y="355" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="64" font-weight="400" text-anchor="start">02</text><text x="860" y="355" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="64" font-weight="400" text-anchor="start">03</text><text x="70" y="435.0" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="43" font-weight="400" text-anchor="start">The short</text><text x="70" y="477.14" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="43" font-weight="400" text-anchor="start">work visit.</text><text x="470" y="435.0" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="43" font-weight="400" text-anchor="start">The personal</text><text x="470" y="477.14" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="43" font-weight="400" text-anchor="start">visit.</text><text x="860" y="435.0" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="43" font-weight="400" text-anchor="start">The returning</text><text x="860" y="477.14" fill="#1B3FC6" font-family="Cormorant Garamond" font-size="43" font-weight="400" text-anchor="start">guest.</text><text x="70" y="565.0" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">Needs a clear rate, workable</text><text x="70" y="600.2" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">dates and a quick way to ask</text><text x="70" y="635.4" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">practical questions.</text><text x="470" y="565.0" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">Visiting friends, family or an</text><text x="470" y="600.2" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">event. Needs honest room</text><text x="470" y="635.4" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">information and arrival details.</text><text x="860" y="565.0" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">Values a familiar hotel and a</text><text x="860" y="600.2" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">straightforward route back to</text><text x="860" y="635.4" fill="#14213B" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">reception.</text><text x="70" y="730.0" fill="#1B3FC6" font-family="Manrope" font-size="22" font-weight="400" text-anchor="start">Design response: readable essentials, useful photography and a clear enquiry path.</text></svg>